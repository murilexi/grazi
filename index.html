<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>te amo</title>
    <!-- Fonte Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="photo-container">
            <img id="mainPhoto" src="meu_amor.jpeg" alt="Foto da Grazi">
        </div>

        <h1>para gragra ♡</h1>

        <div class="typing-text" id="typewriter"></div>

        <div class="timer-title">Penso em você faz:</div>
        <div class="timer">
            <div class="timer-box"><span class="timer-number" id="days">0</span><span class="timer-label">Dias</span></div>
            <div class="timer-box"><span class="timer-number" id="hours">0</span><span class="timer-label">Horas</span></div>
            <div class="timer-box"><span class="timer-number" id="minutes">0</span><span class="timer-label">Min</span></div>
            <div class="timer-box"><span class="timer-number" id="seconds">0</span><span class="timer-label">Seg</span></div>
        </div>

        <button class="btn-love" id="loveBtn">aperta aqui
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
